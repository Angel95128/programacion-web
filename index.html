<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Becv Contact</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <img src="img/Logo.svg" alt="Becv Logo" class="logo">
  </header>

  <section class="hero">
    <h1>Interested in our<br>business pricing?</h1>
    <p>
      Fill out the form to view details and we’ll
      contact you as soon as possible.
    </p>
  </section>

  <section class="form-section">
    <form class="form-card">

      <div class="row">
        <div class="input-group">
          <label>Name</label>
          <input type="text" placeholder="Ethan Johnson">
        </div>

        <div class="input-group">
          <label>Company Email</label>
          <input type="email" placeholder="ethan@johnson.com">
        </div>
      </div>

      <div class="row">
        <div class="input-group">
          <label>Company Size</label>
          <select>
            <option>50–100 employees</option>
            <option>100–200 employees</option>
          </select>
        </div>

        <div class="input-group">
          <label>Subject</label>
          <select>
            <option>Building Landing pages</option>
            <option>Marketing</option>
          </select>
        </div>
      </div>

      <div class="input-group full">
        <label>Message</label>
        <textarea rows="5" placeholder="Write your message..."></textarea>
      </div>

      <button type="submit">Contact Sales</button>

    </form>
  </section>

</body>
</html>
